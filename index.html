<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブロック崩し</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #111827;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }

    .hud {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0 4px;
    }

    .hud-sub {
      color: #93c5fd;
      font-weight: 500;
      font-size: 0.85rem;
    }

    canvas {
      width: 100%;
      max-width: 640px;
      height: auto;
      display: block;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 8px;
      cursor: pointer;
      touch-action: none;
    }

    .hint {
      font-size: 0.875rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>STAGE: <span id="stage">1</span> / 3</div>
    <div>SCORE: <span id="score">0</span></div>
    <div>
      BALLS: <span id="balls">1</span>
      <span class="hud-sub">(あと <span id="next-ball">10</span> 個で+1)</span>
    </div>
    <div>LIVES: <span id="lives">3</span></div>
  </div>

  <canvas id="game" width="640" height="480"></canvas>

  <div class="hint">
    操作: マウス移動 / ← → キー（A / D）｜発射・次へ: クリック または Space
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const stageEl = document.getElementById("stage");
      const scoreEl = document.getElementById("score");
      const ballsEl = document.getElementById("balls");
      const nextBallEl = document.getElementById("next-ball");
      const livesEl = document.getElementById("lives");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;

      // パドル設定
      const PADDLE_WIDTH = 96;
      const PADDLE_HEIGHT = 14;
      const PADDLE_Y = HEIGHT - 32;
      const PADDLE_SPEED = 460; // px/sec

      // ボール設定
      const BALL_RADIUS = 8;
      const MAX_BOUNCE_ANGLE = (60 * Math.PI) / 180;
      const BLOCKS_PER_EXTRA_BALL = 10;

      // ブロック設定
      const BRICK_COLS = 8;
      const BRICK_WIDTH = 64;
      const BRICK_HEIGHT = 22;
      const BRICK_GAP = 8;
      const BRICK_OFFSET_TOP = 52;
      const BRICK_OFFSET_LEFT =
        (WIDTH - (BRICK_COLS * BRICK_WIDTH + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

      const COLOR_MAP = {
        "1": "#ef4444",
        "2": "#f97316",
        "3": "#eab308",
        "4": "#22c55e",
        "5": "#3b82f6",
      };

      // 3ステージ構成（ステージごとにブロック数増加: 30 / 40 / 60 個）
      const STAGES = [
        {
          speed: 350,
          layout: [
            "11111111",
            "22222222",
            "33333333",
            ".444444.",
          ],
        },
        {
          speed: 380,
          layout: [
            "11111111",
            "2.2222.2",
            "33.33.33",
            "444..444",
            "5.5555.5",
            "11111111",
          ],
        },
        {
          speed: 410,
          layout: [
            "11111111",
            "22222222",
            "333..333",
            "44444444",
            "55555555",
            "111..111",
            "22222222",
            "33333333",
          ],
        },
      ];

      const keys = { left: false, right: false };

      let state = "ready"; // "ready" | "playing" | "stageclear" | "cleared" | "gameover"
      let stageIndex = 0;
      let score = 0;
      let lives = 3;
      let brokenCount = 0;
      let bricks = [];
      let balls = [];

      const paddle = {
        x: (WIDTH - PADDLE_WIDTH) / 2,
        y: PADDLE_Y,
        width: PADDLE_WIDTH,
        height: PADDLE_HEIGHT,
      };

      function getCurrentSpeed() {
        return STAGES[stageIndex].speed;
      }

      function createBricks(index) {
        const list = [];
        const layout = STAGES[index].layout;
        for (let row = 0; row < layout.length; row++) {
          const line = layout[row];
          for (let col = 0; col < line.length; col++) {
            const ch = line[col];
            if (!COLOR_MAP[ch]) continue;
            list.push({
              x: BRICK_OFFSET_LEFT + col * (BRICK_WIDTH + BRICK_GAP),
              y: BRICK_OFFSET_TOP + row * (BRICK_HEIGHT + BRICK_GAP),
              width: BRICK_WIDTH,
              height: BRICK_HEIGHT,
              color: COLOR_MAP[ch],
              alive: true,
            });
          }
        }
        return list;
      }

      function createReadyBall() {
        return {
          x: paddle.x + paddle.width / 2,
          y: paddle.y - BALL_RADIUS,
          vx: 0,
          vy: 0,
          radius: BALL_RADIUS,
        };
      }

      function spawnExtraBall(sourceBall) {
        const speed = getCurrentSpeed();
        const baseAngle = Math.atan2(sourceBall.vy, sourceBall.vx);
        const offset = (Math.random() < 0.5 ? 1 : -1) * ((28 * Math.PI) / 180);
        let angle = baseAngle + offset;

        // 水平近辺になって詰まらないよう縦成分を確保
        let vx = speed * Math.cos(angle);
        let vy = speed * Math.sin(angle);
        const minVy = speed * 0.25;
        if (Math.abs(vy) < minVy) {
          vy = (vy >= 0 ? 1 : -1) * minVy;
          const norm = Math.hypot(vx, vy);
          vx = (vx / norm) * speed;
          vy = (vy / norm) * speed;
        }

        return {
          x: sourceBall.x,
          y: sourceBall.y,
          vx,
          vy,
          radius: BALL_RADIUS,
        };
      }

      function updateHud() {
        const remaining =
          BLOCKS_PER_EXTRA_BALL - (brokenCount % BLOCKS_PER_EXTRA_BALL);
        stageEl.textContent = String(stageIndex + 1);
        scoreEl.textContent = String(score);
        ballsEl.textContent = String(balls.length);
        nextBallEl.textContent = String(remaining);
        livesEl.textContent = String(lives);
      }

      function resetBallOnPaddle() {
        balls = [createReadyBall()];
        updateHud();
      }

      function loadStage(index) {
        stageIndex = index;
        bricks = createBricks(stageIndex);
        paddle.x = (WIDTH - paddle.width) / 2;
        state = "ready";
        resetBallOnPaddle();
      }

      function initGame() {
        score = 0;
        lives = 3;
        brokenCount = 0;
        loadStage(0);
      }

      function handleAction() {
        if (state === "cleared" || state === "gameover") {
          initGame();
          return;
        }
        if (state === "stageclear") {
          loadStage(stageIndex + 1);
          return;
        }
        if (state !== "ready") return;

        // 少しランダムな角度で上向きに発射
        const speed = getCurrentSpeed();
        const angle = ((Math.random() * 40 - 20) * Math.PI) / 180;
        balls[0].vx = speed * Math.sin(angle);
        balls[0].vy = -speed * Math.cos(angle);
        state = "playing";
      }

      function clampPaddle() {
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > WIDTH) paddle.x = WIDTH - paddle.width;
      }

      function movePaddleToClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
        const canvasX = (clientX - rect.left) * scaleX;
        paddle.x = canvasX - paddle.width / 2;
        clampPaddle();
      }

      function circleIntersectsRect(cx, cy, r, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        if (dx * dx + dy * dy > r * r) return null;
        return { closestX, closestY, dx, dy };
      }

      function update(dt) {
        if (keys.left) paddle.x -= PADDLE_SPEED * dt;
        if (keys.right) paddle.x += PADDLE_SPEED * dt;
        clampPaddle();

        if (state === "ready") {
          balls[0].x = paddle.x + paddle.width / 2;
          balls[0].y = paddle.y - balls[0].radius;
          return;
        }

        if (state !== "playing") return;

        const speed = getCurrentSpeed();
        const survivingBalls = [];
        const spawnedBalls = [];
        let stageCleared = false;

        for (const ball of balls) {
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          // 左右の壁
          if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx = Math.abs(ball.vx);
          } else if (ball.x + ball.radius > WIDTH) {
            ball.x = WIDTH - ball.radius;
            ball.vx = -Math.abs(ball.vx);
          }

          // 上の壁
          if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy);
          }

          // 下端から落ちたボールは除外
          if (ball.y - ball.radius > HEIGHT) {
            continue;
          }

          // パドルとの当たり判定（下向き移動中のみ）
          if (ball.vy > 0) {
            const hit = circleIntersectsRect(
              ball.x,
              ball.y,
              ball.radius,
              paddle.x,
              paddle.y,
              paddle.width,
              paddle.height
            );
            if (hit) {
              const hitRatio =
                (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
              const clampedRatio = Math.max(-1, Math.min(1, hitRatio));
              const bounceAngle = clampedRatio * MAX_BOUNCE_ANGLE;
              ball.vx = speed * Math.sin(bounceAngle);
              ball.vy = -speed * Math.cos(bounceAngle);
              ball.y = paddle.y - ball.radius;
            }
          }

          // ブロックとの当たり判定（1フレーム1個まで処理）
          for (const brick of bricks) {
            if (!brick.alive) continue;
            const hit = circleIntersectsRect(
              ball.x,
              ball.y,
              ball.radius,
              brick.x,
              brick.y,
              brick.width,
              brick.height
            );
            if (!hit) continue;

            brick.alive = false;
            score += 10;
            brokenCount += 1;

            const overlapLeft = ball.x + ball.radius - brick.x;
            const overlapRight =
              brick.x + brick.width - (ball.x - ball.radius);
            const overlapTop = ball.y + ball.radius - brick.y;
            const overlapBottom =
              brick.y + brick.height - (ball.y - ball.radius);
            const minOverlapX = Math.min(overlapLeft, overlapRight);
            const minOverlapY = Math.min(overlapTop, overlapBottom);

            if (minOverlapX < minOverlapY) {
              ball.vx = -ball.vx;
            } else {
              ball.vy = -ball.vy;
            }

            if (brokenCount % BLOCKS_PER_EXTRA_BALL === 0) {
              spawnedBalls.push(spawnExtraBall(ball));
            }
            break;
          }

          survivingBalls.push(ball);

          if (bricks.every((b) => !b.alive)) {
            stageCleared = true;
            break;
          }
        }

        if (stageCleared) {
          if (stageIndex + 1 < STAGES.length) {
            state = "stageclear";
          } else {
            state = "cleared";
          }
          updateHud();
          return;
        }

        balls = survivingBalls.concat(spawnedBalls);

        // すべてのボールが落ちたらライフを減らす
        if (balls.length === 0) {
          lives -= 1;
          if (lives <= 0) {
            state = "gameover";
            updateHud();
          } else {
            state = "ready";
            resetBallOnPaddle();
          }
          return;
        }

        updateHud();
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = "rgba(17, 24, 39, 0.72)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "#f9fafb";
        ctx.font = "bold 32px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(title, WIDTH / 2, HEIGHT / 2 - 12);

        ctx.fillStyle = "#d1d5db";
        ctx.font = "16px system-ui, sans-serif";
        ctx.fillText(subtitle, WIDTH / 2, HEIGHT / 2 + 24);
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // ブロック描画
        for (const brick of bricks) {
          if (!brick.alive) continue;
          ctx.fillStyle = brick.color;
          ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
        }

        // パドル描画
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

        // ボール描画
        ctx.fillStyle = "#f9fafb";
        for (const ball of balls) {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        if (state === "ready") {
          drawOverlay(
            `STAGE ${stageIndex + 1}`,
            "クリック または Space で発射"
          );
        } else if (state === "stageclear") {
          drawOverlay(
            `STAGE ${stageIndex + 1} CLEAR!`,
            "クリック または Space で次のステージへ"
          );
        } else if (state === "cleared") {
          drawOverlay(
            "ALL STAGES CLEAR!",
            "クリック または Space でもう一度遊ぶ"
          );
        } else if (state === "gameover") {
          drawOverlay("GAME OVER", "クリック または Space でリスタート");
        }
      }

      // イベント登録
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          keys.left = true;
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          keys.right = true;
        } else if (e.code === "Space" || e.key === "Enter") {
          e.preventDefault();
          handleAction();
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          keys.left = false;
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          keys.right = false;
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        movePaddleToClientX(e.clientX);
      });

      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length > 0) {
            e.preventDefault();
            movePaddleToClientX(e.touches[0].clientX);
          }
        },
        { passive: false }
      );

      canvas.addEventListener("click", () => {
        handleAction();
      });

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      initGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
