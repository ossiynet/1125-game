<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブロック崩し</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #111827;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }

    .hud {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 600;
      padding: 0 4px;
    }

    canvas {
      width: 100%;
      max-width: 640px;
      height: auto;
      display: block;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 8px;
      cursor: pointer;
      touch-action: none;
    }

    .hint {
      font-size: 0.875rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
  </div>

  <canvas id="game" width="640" height="480"></canvas>

  <div class="hint">
    操作: マウス移動 / ← → キー（A / D）｜発射・リスタート: クリック または Space
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;

      // パドル設定
      const PADDLE_WIDTH = 96;
      const PADDLE_HEIGHT = 14;
      const PADDLE_Y = HEIGHT - 32;
      const PADDLE_SPEED = 460; // px/sec

      // ボール設定
      const BALL_RADIUS = 8;
      const BALL_SPEED = 360; // px/sec
      const MAX_BOUNCE_ANGLE = (60 * Math.PI) / 180;

      // ブロック設定
      const BRICK_ROWS = 5;
      const BRICK_COLS = 8;
      const BRICK_WIDTH = 64;
      const BRICK_HEIGHT = 22;
      const BRICK_GAP = 8;
      const BRICK_OFFSET_TOP = 52;
      const BRICK_OFFSET_LEFT =
        (WIDTH - (BRICK_COLS * BRICK_WIDTH + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
      const ROW_COLORS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6"];

      const keys = { left: false, right: false };

      let state = "ready"; // "ready" | "playing" | "cleared" | "gameover"
      let score = 0;
      let lives = 3;
      let bricks = [];

      const paddle = {
        x: (WIDTH - PADDLE_WIDTH) / 2,
        y: PADDLE_Y,
        width: PADDLE_WIDTH,
        height: PADDLE_HEIGHT,
      };

      const ball = {
        x: WIDTH / 2,
        y: PADDLE_Y - BALL_RADIUS,
        vx: 0,
        vy: 0,
        radius: BALL_RADIUS,
      };

      function createBricks() {
        const list = [];
        for (let row = 0; row < BRICK_ROWS; row++) {
          for (let col = 0; col < BRICK_COLS; col++) {
            list.push({
              x: BRICK_OFFSET_LEFT + col * (BRICK_WIDTH + BRICK_GAP),
              y: BRICK_OFFSET_TOP + row * (BRICK_HEIGHT + BRICK_GAP),
              width: BRICK_WIDTH,
              height: BRICK_HEIGHT,
              color: ROW_COLORS[row % ROW_COLORS.length],
              alive: true,
            });
          }
        }
        return list;
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        livesEl.textContent = String(lives);
      }

      function resetBallOnPaddle() {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius;
        ball.vx = 0;
        ball.vy = 0;
      }

      function initGame() {
        score = 0;
        lives = 3;
        bricks = createBricks();
        paddle.x = (WIDTH - paddle.width) / 2;
        state = "ready";
        resetBallOnPaddle();
        updateHud();
      }

      function launchBall() {
        if (state === "cleared" || state === "gameover") {
          initGame();
          return;
        }
        if (state !== "ready") return;

        // 少しランダムな角度で上向きに発射
        const angle = ((Math.random() * 40 - 20) * Math.PI) / 180;
        ball.vx = BALL_SPEED * Math.sin(angle);
        ball.vy = -BALL_SPEED * Math.cos(angle);
        state = "playing";
      }

      function clampPaddle() {
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > WIDTH) paddle.x = WIDTH - paddle.width;
      }

      function movePaddleToClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
        const canvasX = (clientX - rect.left) * scaleX;
        paddle.x = canvasX - paddle.width / 2;
        clampPaddle();
      }

      function circleIntersectsRect(cx, cy, r, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        if (dx * dx + dy * dy > r * r) return null;
        return { closestX, closestY, dx, dy };
      }

      function update(dt) {
        // キーボードによるパドル移動
        if (keys.left) paddle.x -= PADDLE_SPEED * dt;
        if (keys.right) paddle.x += PADDLE_SPEED * dt;
        clampPaddle();

        if (state === "ready") {
          resetBallOnPaddle();
          return;
        }

        if (state !== "playing") return;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // 左右の壁
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.vx = Math.abs(ball.vx);
        } else if (ball.x + ball.radius > WIDTH) {
          ball.x = WIDTH - ball.radius;
          ball.vx = -Math.abs(ball.vx);
        }

        // 上の壁
        if (ball.y - ball.radius < 0) {
          ball.y = ball.radius;
          ball.vy = Math.abs(ball.vy);
        }

        // 下端（ミス判定）
        if (ball.y - ball.radius > HEIGHT) {
          lives -= 1;
          updateHud();
          if (lives <= 0) {
            state = "gameover";
          } else {
            state = "ready";
            resetBallOnPaddle();
          }
          return;
        }

        // パドルとの当たり判定（下向き移動中のみ）
        if (ball.vy > 0) {
          const hit = circleIntersectsRect(
            ball.x,
            ball.y,
            ball.radius,
            paddle.x,
            paddle.y,
            paddle.width,
            paddle.height
          );
          if (hit) {
            const hitRatio =
              (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            const clampedRatio = Math.max(-1, Math.min(1, hitRatio));
            const bounceAngle = clampedRatio * MAX_BOUNCE_ANGLE;
            ball.vx = BALL_SPEED * Math.sin(bounceAngle);
            ball.vy = -BALL_SPEED * Math.cos(bounceAngle);
            ball.y = paddle.y - ball.radius;
          }
        }

        // ブロックとの当たり判定（1フレーム1個まで処理）
        for (const brick of bricks) {
          if (!brick.alive) continue;
          const hit = circleIntersectsRect(
            ball.x,
            ball.y,
            ball.radius,
            brick.x,
            brick.y,
            brick.width,
            brick.height
          );
          if (!hit) continue;

          brick.alive = false;
          score += 10;
          updateHud();

          // 重なりの浅い軸を反転させる
          const overlapLeft = ball.x + ball.radius - brick.x;
          const overlapRight = brick.x + brick.width - (ball.x - ball.radius);
          const overlapTop = ball.y + ball.radius - brick.y;
          const overlapBottom = brick.y + brick.height - (ball.y - ball.radius);
          const minOverlapX = Math.min(overlapLeft, overlapRight);
          const minOverlapY = Math.min(overlapTop, overlapBottom);

          if (minOverlapX < minOverlapY) {
            ball.vx = -ball.vx;
          } else {
            ball.vy = -ball.vy;
          }
          break;
        }

        // 全破壊チェック
        if (bricks.every((b) => !b.alive)) {
          state = "cleared";
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = "rgba(17, 24, 39, 0.72)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "#f9fafb";
        ctx.font = "bold 32px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(title, WIDTH / 2, HEIGHT / 2 - 12);

        ctx.fillStyle = "#d1d5db";
        ctx.font = "16px system-ui, sans-serif";
        ctx.fillText(subtitle, WIDTH / 2, HEIGHT / 2 + 24);
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // ブロック描画
        for (const brick of bricks) {
          if (!brick.alive) continue;
          ctx.fillStyle = brick.color;
          ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
        }

        // パドル描画
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

        // ボール描画
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#f9fafb";
        ctx.fill();

        if (state === "ready") {
          drawOverlay("READY", "クリック または Space で発射");
        } else if (state === "cleared") {
          drawOverlay("GAME CLEAR!", "クリック または Space でもう一度遊ぶ");
        } else if (state === "gameover") {
          drawOverlay("GAME OVER", "クリック または Space でリスタート");
        }
      }

      // イベント登録
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          keys.left = true;
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          keys.right = true;
        } else if (e.code === "Space" || e.key === "Enter") {
          e.preventDefault();
          launchBall();
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          keys.left = false;
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          keys.right = false;
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        movePaddleToClientX(e.clientX);
      });

      canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length > 0) {
          e.preventDefault();
          movePaddleToClientX(e.touches[0].clientX);
        }
      }, { passive: false });

      canvas.addEventListener("click", () => {
        launchBall();
      });

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      initGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
